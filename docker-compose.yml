version: "3.9"

services:
  web:
    build: .
    container_name: django_web
    expose:
      - "8000"
    volumes:
      - .:/app
    restart: always

  nginx:
    image: nginx:1.27-alpine
    container_name: django_nginx
    ports:
      - "8080:80"
    depends_on:
      - web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    restart: always
